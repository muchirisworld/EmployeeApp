<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    
    <h:head>
        <title>Employee Management System</title>
    </h:head>
    
    <h:body>
        <h:form id="dialogForm">
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true">
                <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times" />
            </p:confirmDialog>
        </h:form>

        <h:form id="employeeForm">
            <p:messages id="messages" showDetail="true" autoUpdate="true" />
            
            <div style="text-align: center; margin-top: 20px;">
                <h1>Employee Management System</h1>
                <p:button value="Add Employee"
                                icon="pi pi-plus" 
                                outcome="create" 
                                styleClass="p-button-success" />
            </div>

            <p:dataTable value="#{employeeBean.employees}" var="emp" 
                        style="width: 80%; margin: 20px auto;"
                        paginator="true" rows="10"
                        paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                        rowsPerPageTemplate="5,10,15">
                
                <p:column headerText="First Name">
                    <h:outputText value="#{emp.firstName}" />
                </p:column>
                
                <p:column headerText="Last Name">
                    <h:outputText value="#{emp.lastName}" />
                </p:column>
                
                <p:column headerText="Email">
                    <h:outputText value="#{emp.email}" />
                </p:column>
                
                <p:column headerText="Department">
                    <h:outputText value="#{emp.department}" />
                </p:column>
                
                <p:column headerText="Salary">
                    <h:outputText value="#{emp.salary}">
                        <f:convertNumber type="currency" currencySymbol="$" />
                    </h:outputText>
                </p:column>
                
                <p:column headerText="Actions" style="width: 100px;">
                    <p:commandButton icon="pi pi-pencil" 
                                   action="#{employeeBean.edit(emp.id)}"
                                   styleClass="p-button-warning"
                                   style="margin-right: 3px;" />
                    <p:commandButton icon="pi pi-trash" 
                                   action="#{employeeBean.delete(emp.id)}"
                                   styleClass="p-button-danger"
                                   update="@form"
                                   process="@this">
                        <p:confirm header="Delete Employee"
                                 message="Are you sure you want to delete this employee?"
                                 icon="pi pi-exclamation-triangle" />
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </h:form>
    </h:body>
</html>
