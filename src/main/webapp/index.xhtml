<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    
    <h:head>
        <title>Employee Management System</title>
    </h:head>
    
    <h:body>

        <h:form>
            <div style="text-align: center; margin-top: 20px;">
                <h1>Employee Management System</h1>
                <p:commandButton value="Add Employee" icon="pi pi-plus" 
                                action="#{employeeBean.prepareCreate()}" update="@form" 
                                style="margin-bottom: 20px;" />
            </div>

            <p:dataTable value="#{employeeBean.employees}" var="emp" 
                        style="width: 80%; margin: 20px auto;"
                        
                    >
                
                <p:column headerText="First Name">
                    <h:outputText value="#{emp.firstName}" />
                </p:column>
                
                <p:column headerText="Last Name">
                    <h:outputText value="#{emp.lastName}" />
                </p:column>
                
                <p:column headerText="Email">
                    <h:outputText value="#{emp.email}" />
                </p:column>
                
                <p:column headerText="Department">
                    <h:outputText value="#{emp.department}" />
                </p:column>
                
                <p:column headerText="Salary">
                    <h:outputText value="#{emp.salary}">
                        <f:convertNumber type="currency" currencySymbol="$" />
                    </h:outputText>
                </p:column>
                
                <p:column headerText="Actions" style="width: 100px;">
                    <p:commandButton icon="pi pi-pencil" style="margin-right: 3px;" />
                    <p:commandButton icon="pi pi-trash" 
                                   onclick="return confirm('Are you sure you want to delete this employee?')" />
                </p:column>
            </p:dataTable>
        </h:form>
    </h:body>
</html>
